name: Curevan API CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # a throw-away PostgreSQL for the tests: its name contains "test", the test scripts refuse any other database
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: curevan
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: curevan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curevan -d curevan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: curevan_test
      DB_USER: curevan
      DB_PASSWORD: testpw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # the acceptance suite also checks that every API call the website makes exists (docs/API_CALL_MAP.md of the website repo, expected next to this one)
      - name: Fetch the website repo
        run: git clone --depth 1 --branch main https://github.com/clever-minds/curevan-dev.git ../curevan-dev
      - name: Install dependencies
        run: npm ci
      # unit tests, the whole acceptance suite in both booking flows, and the go-live checklist mapping (tests/checklist.json).
      # Razorpay, Firebase, mail, WhatsApp, SMS, telephony and Shiprocket are replaced by stubs inside the tests: no real key is used.
      - name: Test
        run: npm test
